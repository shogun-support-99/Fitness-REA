apply plugin: 'com.android.application'

android {
    namespace 'com.reafit.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.reafit.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }

    // The keystore is generated by CI on first build and committed back to
    // the repo so every APK has the same signature — updates install over
    // older builds. Fine for an open-source sideload app; use secrets for
    // anything that ships to a store.
    signingConfigs {
        release {
            storeFile file(System.getenv('REA_KEYSTORE') ?: '../rea-release.keystore')
            storePassword System.getenv('REA_STORE_PASS') ?: 'reafit'
            keyAlias System.getenv('REA_KEY_ALIAS') ?: 'reafit'
            keyPassword System.getenv('REA_KEY_PASS') ?: 'reafit'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // WebViewAssetLoader serves the bundled web app over
    // https://appassets.androidplatform.net — a real secure context, so
    // crypto.subtle (password hashing) and the clipboard API work.
    implementation 'androidx.webkit:webkit:1.11.0'
}
