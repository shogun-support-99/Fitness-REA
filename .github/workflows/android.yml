name: Build Android APK

# Wraps the web app into a signed Android APK and publishes it to the
# GitHub release — the landing page and README link to
# …/releases/latest/download/rea-fit.apk
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Assemble Android project sources
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/drawable
          cp public/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/icon-maskable-512.png android/app/src/main/res/drawable/ic_launcher_foreground.png

      - name: Ensure release keystore
        run: |
          if [ ! -f android/rea-release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/rea-release.keystore \
              -alias reafit -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass reafit -keypass reafit \
              -dname "CN=REA Fit, OU=Apps, O=shogun-support-99, C=IN"
            git config user.name "arena-agent"
            git config user.email "297053741+arena-agent@users.noreply.github.com"
            git add android/rea-release.keystore
            git commit -m "Add release keystore for APK signing [skip ci]"
            git push
          fi

      - name: Build release APK
        env:
          REA_KEYSTORE: ${{ github.workspace }}/android/rea-release.keystore
          REA_STORE_PASS: reafit
          REA_KEY_ALIAS: reafit
          REA_KEY_PASS: reafit
        run: cd android && gradle assembleRelease --no-daemon

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rea-fit.apk
          ls -lh rea-fit.apk
          # the release tag follows the version in android/app/build.gradle
          TAG="v$(grep -oP "versionName '\\K[^']+" android/app/build.gradle)"
          echo "Publishing $TAG"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" rea-fit.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" rea-fit.apk \
              --title "REA Fit $TAG — Android" \
              --notes "Install-once Android build. Works fully offline; your data lives on your phone. Download \`rea-fit.apk\`, open it, and allow installs from this source. Updates install over previous builds (same signing key)." \
              -R "$GITHUB_REPOSITORY"
          fi
