<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="REA Fit" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // pre-paint: anyone heading into the app gets a black background, so the
      // white marketing page never flashes before React mounts
      try {
        var h = location.hash
        var toApp =
          h.indexOf('#/app') === 0 ||
          ((h === '' || h === '#') &&
            (matchMedia('(display-mode: standalone)').matches ||
              navigator.standalone === true ||
              innerWidth <= 768 ||
              localStorage.getItem('reafit_launched') === 'true'))
        document.documentElement.style.background = toApp ? '#000000' : '#ffffff'
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="REA Fit — a free workout tracker and gym logger. Plan routines, log every set, track personal records, and watch your strength take off."
    />
    <title>REA Fit — Workout Tracker &amp; Gym Logger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
